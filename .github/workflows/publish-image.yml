name: CI and publish image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/api/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test (Node)
        run: pnpm test
      - name: Test (Go)
        run: pnpm test:go
      - name: Build application
        run: pnpm run build

  publish-image:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to NAS
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Production Deployment Webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          PROJECT: travel-site
        run: |
          if [[ -z "$DEPLOY_WEBHOOK_URL" ]]; then
            echo "::error::Required Actions secret DEPLOY_WEBHOOK_URL is not configured."
            exit 1
          fi
          payload=$(jq -n \
            --arg image "${IMAGE_NAME,,}" \
            --arg tag "latest" \
            '{image: $image, tag: $tag}')
          # Fire-and-forget: n8n may keep the request open while the NAS restarts.
          # A read timeout after the connection was established still counts as
          # delivered; failures are reported by n8n to Discord.
          set +e
          result=$(curl --fail --show-error --silent --output /dev/null \
            --write-out '%{http_code} %{time_connect}' \
            --connect-timeout 10 --max-time 15 \
            --request POST \
            "${DEPLOY_WEBHOOK_URL%/}/${PROJECT}" \
            --header "Content-Type: application/json" \
            --data "$payload")
          rc=$?
          set -e
          connect_time=${result##* }
          if [[ $rc -eq 0 ]]; then
            echo "Deployment webhook triggered successfully."
          elif [[ $rc -eq 28 && "$connect_time" != "0.000000" ]]; then
            echo "Deployment webhook accepted; n8n is still processing (no wait)."
          else
            echo "::error::Deployment webhook request failed (curl exit $rc)."
            exit 1
          fi
