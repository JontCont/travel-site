name: CI and publish image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build application
        run: npm run build

  publish-image:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to NAS
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Production Deployment Webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          PROJECT: travel-site
        run: |
          if [[ -z "$DEPLOY_WEBHOOK_URL" ]]; then
            echo "::error::Required Actions secret DEPLOY_WEBHOOK_URL is not configured."
            exit 1
          fi
          payload=$(jq -n \
            --arg image "${IMAGE_NAME,,}" \
            --arg tag "latest" \
            '{image: $image, tag: $tag}')
          response=$(curl --fail-with-body --show-error --silent \
            --connect-timeout 10 --max-time 60 \
            --request POST \
            "${DEPLOY_WEBHOOK_URL%/}/${PROJECT}" \
            --header "Content-Type: application/json" \
            --data "$payload")
          printf '%s\n' "$response"
          if ! jq -e -s \
            --arg project "$PROJECT" \
            --arg image "${IMAGE_NAME,,}:latest" \
            'length == 1 and (.[0] | type == "object" and .status == "success" and .project == $project and .image == $image)' \
            <<< "$response" > /dev/null; then
            echo "::error::Deployment webhook did not confirm success for the expected project and image."
            exit 1
          fi
