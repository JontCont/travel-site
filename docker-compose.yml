name: "travel-site"
services:
  travel-site:
    image: ${TRIP_IMAGE:?Set TRIP_IMAGE in .env}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "1026:100"
    environment:
      TRIP_OIDC_ISSUER: ${TRIP_OIDC_ISSUER:-}
      TRIP_OIDC_CLIENT_ID: ${TRIP_OIDC_CLIENT_ID:-}
      TRIP_OIDC_CLIENT_SECRET: ${TRIP_OIDC_CLIENT_SECRET:-}
      TRIP_OIDC_REDIRECT_URI: ${TRIP_OIDC_REDIRECT_URI:-}
      TRIP_OIDC_ADMIN_USERS: ${TRIP_OIDC_ADMIN_USERS:-}
      TRIP_OIDC_ADMIN_GROUP: ${TRIP_OIDC_ADMIN_GROUP:-}
      TRIP_TRUST_PROXY: ${TRIP_TRUST_PROXY:-}
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "4187:4187"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
