services:
  travel-site:
    image: ${TRIP_IMAGE:?Set TRIP_IMAGE in .env}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "${TRIP_UID:-1000}:${TRIP_GID:-1000}"
    environment:
      NODE_ENV: production
      PORT: "4187"
      TRIP_HOST: "0.0.0.0"
      TRIP_DATABASE_PATH: /app/data/trips.sqlite
      TRIP_COOKIE_SECURE: "1"
      TRIP_VIEW_CODE: ${TRIP_VIEW_CODE:?Set TRIP_VIEW_CODE in .env}
      TRIP_ADMIN_CODE: ${TRIP_ADMIN_CODE:?Set TRIP_ADMIN_CODE in .env}
      TRIP_TRUST_PROXY: ${TRIP_TRUST_PROXY:-0}
    volumes:
      - ./data:/app/data
    ports:
      - "${TRIP_BIND_IP:-192.168.0.18}:4187:4187"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
