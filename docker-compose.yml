name: "travel-site"
services:
  travel-site:
    image: ${TRIP_IMAGE:?Set TRIP_IMAGE in .env}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "1026:100"
    environment:
      TRIP_VIEW_CODE: ${TRIP_VIEW_CODE:?Set TRIP_VIEW_CODE in .env}
      TRIP_ADMIN_CODE: ${TRIP_ADMIN_CODE:?Set TRIP_ADMIN_CODE in .env}
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "4187:4187"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
