name: "travel-site-dev"
services:
  travel-site:
    extends:
      file: docker-compose.base.yml
      service: travel-site
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    ports:
      - "5173:5173"
      - "4187:4187"
    environment:
      NODE_ENV: development
    volumes:
      - ../data:/data
      - ../apps:/app/apps
      - ../packages:/app/packages
      - ../tests:/app/tests
      - ../.agents:/app/.agents
    command: pnpm dev -- --host 0.0.0.0
